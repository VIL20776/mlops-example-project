name: Train on EC2

on:
  workflow_dispatch

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Train via SSM
        run: |
          command_id=$(aws ssm send-command \
            --instance-ids ${{ secrets.INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --parameters commands='[
              "aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.ECR_REPOSITORY_URL }}",
              "docker pull ${{ secrets.ECR_REPOSITORY_URL }}:latest",
              "docker run --rm -e MLFLOW_TRACKING_URI=${{ secrets.MLFLOW_TRACKING_URI }} --network host --name app ${{ secrets.ECR_REPOSITORY_URL }}:latest"
            ]' \
            --comment "Run training container" \
            --query 'Command.CommandId' \
            --output text)
          
          echo "Command ID: $command_id"

          aws ssm wait command-executed --command-id $command_id --instance-id ${{ secrets.INSTANCE_ID }}
          
          status=$(aws ssm get-command-invocation --command-id $command_id --instance-id ${{ secrets.INSTANCE_ID }} --query 'Status' --output text)
          
          if [ "$status" != "Success" ]; then
            echo "SSM command failed with status: $status"
            echo "Standard Output:"
            aws ssm get-command-invocation --command-id $command_id --instance-id ${{ secrets.INSTANCE_ID }} --query 'StandardOutputContent' --output text
            echo "Standard Error:"
            aws ssm get-command-invocation --command-id $command_id --instance-id ${{ secrets.INSTANCE_ID }} --query 'StandardErrorContent' --output text
            exit 1
          fi