name: 03-Deploy to S3 Model Registry
on:
  workflow_dispatch:
    inputs:
      model_version:
        description: 'Model version to deploy'
        required: false
        default: 'release'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          pip install --no-cache-dir -r deploy/requirements.txt

      - name: Deploy model to S3
        run: |
          MLFLOW_TRACKING_URI=${{ secrets.MLFLOW_TRACKING_URI }} \
          MODEL_NAME=${{ secrets.PROJECT_ID }} \
          MODEL_VERSION=${{ github.event.inputs.model_version }} \
          python deploy/download_model.py
          
          aws s3 cp ./model s3://${{ secrets.MODEL_S3_BUCKET }}/${{ secrets.PROJECT_ID }}/${{ github.event.inputs.model_version }} --recursive